services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.10.3-alpine
    environment:
      # Lets redis-cli authenticate without putting the password on its command line
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env sets DB_HOST=localhost for host-side runs; inside the compose
      # network the DB is reachable as `db`.
      DB_HOST: db
    # Run-once init container: applies pending migrations, then exits 0.
    # Requires the alembic scaffold (alembic.ini at repo root, env.py on db_url).
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      RUN_WORKERS: "0"
      # .env sets DB_HOST=localhost for host-side runs; inside the compose
      # network the DB is reachable as `db`.
      DB_HOST: db
      REDIS_HOST: redis

    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      start_period: 20s

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command:
      - taskiq
      - worker
      - --app-dir
      - src
      - --max-async-tasks
      - "8"
      - --shutdown-timeout
      - "60"
      - broker.broker:broker
      - tasks.poll_nhl_live
      - tasks.poll_nba_live
      - tasks.publish_pending
      - tasks.sync_today_games
      - tasks.start_task
    restart: unless-stopped

  scheduler:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    command:
      - taskiq
      - scheduler
      - --app-dir
      - src
      - broker.scheduler:scheduler
      - tasks.sync_today_games
      - tasks.publish_pending
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
    driver: local
