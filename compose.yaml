services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # .env sets DB_HOST=localhost for host-side runs; inside the compose
      # network the DB is reachable as `db`.
      DB_HOST: db
    # Run-once init container: applies pending migrations, then exits 0.
    # Requires the alembic scaffold (alembic.ini at repo root, env.py on db_url).
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    # Values come from your local .env (never baked into the image).
    env_file:
      - .env
    environment:
      # Single scheduler owns timers; API never runs background jobs.
      RUN_WORKERS: "0"

    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "src"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      start_period: 20s

  scheduler:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      RUN_WORKERS: "1"
    restart: unless-stopped
    # Singleton: never scale this past 1. Timers fire here only.
    # NOTE: entrypoint not implemented yet (next step: python -m workers.run).
    command: ["python", "-m", "workers.run", "--scheduler"]

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      RUN_WORKERS: "1"
    restart: unless-stopped
    # Competing consumers: scale with `docker compose up --scale worker=3`.
    # Claims jobs via Postgres (INSERT ... ON CONFLICT DO NOTHING /
    # SELECT ... FOR UPDATE SKIP LOCKED) so duplicates are impossible.
    # NOTE: entrypoint not implemented yet (next step: python -m workers.run).
    command: ["python", "-m", "workers.run", "--worker"]
    mem_limit: 256m
    cpus: 0.5

volumes:
  pgdata:
