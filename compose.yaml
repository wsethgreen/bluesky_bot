services:
  app:
    build: .
    ports:
      - "8000:8000"
    # Values come from your local .env (never baked into the image).
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      start_period: 20s
