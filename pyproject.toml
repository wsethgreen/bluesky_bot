[project]
name = "bluesky-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seth", email = "wsethgreen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "atproto>=0.0.72",
    "fastapi>=0.142.1",
    "httpx2>=2.13.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tzdata>=2026.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

# The installed dist is never imported at runtime (uvicorn runs from
# --app-dir src); this list only needs the real packages so `uv sync`
# and image builds succeed. Top-level app.py stays out of the wheel.
[tool.uv.build-backend]
module-name = ["clients", "config", "models", "routes", "services", "utils", "workers"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
