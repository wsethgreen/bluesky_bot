[project]
name = "bluesky-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Seth", email = "wsethgreen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "apscheduler>=3.11.3",
    "asyncpg==0.31.0",
    "atproto==0.0.72",
    "boto3==1.43.108",
    "fastapi==0.142.1",
    "greenlet>=3.5.6",
    "httpx2==2.13.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.1.3",
    "tzdata>=2026.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
